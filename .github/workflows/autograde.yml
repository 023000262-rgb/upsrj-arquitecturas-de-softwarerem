name: Evaluación de pruebas

on:
  push:
    branches:
      - develop
      - 'feature/exercise**'
  pull_request:
    branches:
      - develop
      - 'feature/exercise**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar entorno con Dev Container
      uses: devcontainers/ci@v0.3
      with:
        runCmd: echo "Entorno listo para evaluación"

    - name: Instalar dependencias de Python
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            echo "⚠️ No se encontró requirements.txt, instalando dependencias básicas..."
            pip install flask requests
          fi

    - name: Levantar microservicios y ejecutar proyecto
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          chmod +x ./src/run-all.sh
          ./src/run-all.sh &
          sleep 5  # espera a que los microservicios estén disponibles

    - name: Ejecutar pruebas unitarias
      uses: devcontainers/ci@v0.3
      with:
        runCmd: python tests/test_evaluation.py
