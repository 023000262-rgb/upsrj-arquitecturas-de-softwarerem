name: Evaluación de pruebas

on:
  push:
    branches:
      - develop
      - 'feature/exercise**'
  pull_request:
    branches:
      - develop
      - 'feature/exercise**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar entorno con Dev Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: mcr.microsoft.com/devcontainers/python:3.12
          runCmd: echo "Entorno listo para evaluación"

      - name: Instalar dependencias de Python
        uses: devcontainers/ci@v0.3
        with:
          imageName: mcr.microsoft.com/devcontainers/python:3.12
          runCmd: pip install -r requirements.txt

      - name: Levantar microservicios
        uses: devcontainers/ci@v0.3
        with:
          imageName: mcr.microsoft.com/devcontainers/python:3.12
          runCmd: |
            chmod +x ./src/run-all.sh
            ./src/run-all.sh &
            sleep 5

      - name: Ejecutar pruebas unitarias
        uses: devcontainers/ci@v0.3
        with:
          imageName: mcr.microsoft.com/devcontainers/python:3.12
          runCmd: python tests/test_evaluation.py

