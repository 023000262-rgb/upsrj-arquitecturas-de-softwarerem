name: Evaluación de pruebas

on:
  push:
    branches:
      - develop
      - 'feature/exercise**'
  pull_request:
    branches:
      - develop
      - 'feature/exercise**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar entorno con Dev Container
      uses: devcontainers/ci@v0.3
      with:
        runCmd: echo "Entorno listo para evaluación"
        push: false

    - name: Instalar dependencias
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          python -m pip install --upgrade pip
          pip install flask requests
        push: false

    - name: Ejecutar proyecto
      uses: devcontainers/ci@v0.3
      with:
        runCmd: python src/main.py
        push: false

    - name: Ejecutar pruebas unitarias
      uses: devcontainers/ci@v0.3
      with:
        runCmd: python tests/test_evaluation.py
        push: false
