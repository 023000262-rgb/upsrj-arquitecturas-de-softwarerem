name: Evaluación de pruebas

on:
  push:
    branches:
      - develop
      - 'feature/exercise**'
  pull_request:
    branches:
      - develop
      - 'feature/exercise**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ejecutar pruebas en Dev Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: mcr.microsoft.com/devcontainers/python:3.12
          subFolder: .devcontainer   # Ajusta si tu devcontainer.json está en otra carpeta
          runCmd: |
            # Instalar dependencias
            pip install --upgrade pip
            pip install -r requirements.txt

            # Levantar microservicios
            chmod +x ./src/run-all.sh
            ./src/run-all.sh &

            # Esperar a que los servicios estén activos
            sleep 10

            # Ejecutar tests unitarios
            python tests/test_evaluation.py

