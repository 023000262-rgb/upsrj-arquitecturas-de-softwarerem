<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>
    <h1>Lista de Usuarios</h1>
    <ul>
    {% for user in users %}
        <li>{{ user.id }} - {{ user.name }}</li>
    {% else %}
        <li>No hay usuarios</li>
    {% endfor %}
    </ul>

    <a href="/users/create">Crear nuevo usuario</a>
</body>
</html>
